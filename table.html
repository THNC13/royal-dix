<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>League Table · Royal Dix</title>
  <meta name="description" content="Econ Winter Pool League 2026/27 team table.">
  <meta name="theme-color" content="#0a2f21">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="table">

<header class="topbar" id="topbar"></header>

<main>

  <section class="block" id="table" aria-labelledby="table-h">
    <div class="block-head">
      <h2 id="table-h">League table</h2>
      <p class="sub" id="league-sub"></p>
    </div>
    <div class="chalkboard">
      <div class="scroll">
        <table class="league" id="league-table">
          <thead>
            <tr>
              <th class="c-pos" scope="col">Pos</th>
              <th class="c-name" scope="col">Team</th>
              <th scope="col"><abbr title="Played">P</abbr></th>
              <th scope="col"><abbr title="Won">W</abbr></th>
              <th scope="col"><abbr title="Lost">L</abbr></th>
              <th class="hide-s" scope="col"><abbr title="Frames for">F</abbr></th>
              <th class="hide-s" scope="col"><abbr title="Frames against">A</abbr></th>
              <th scope="col"><abbr title="Frame difference">+/−</abbr></th>
              <th class="c-pts" scope="col">Pts</th>
            </tr>
          </thead>
          <tbody id="league-body"></tbody>
        </table>
      </div>
    </div>
  </section>

</main>

<footer class="foot" id="foot"></footer>

<script src="data/data.js"></script>
<script src="js/common.js"></script>
<script src="js/app.js"></script>
</body>
</html>
